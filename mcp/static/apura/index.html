<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apura · Conversa Eleitoral</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef1f6; --surface: #fff; --ink: #0c1222; --muted: #5c6478;
      --line: #dde3ec; --brand: #0d4f4a; --brand-light: #e6f4f2;
      --user-bg: #0d4f4a; --user-fg: #fff; --bot-bg: #fff;
      --shadow: 0 8px 32px rgba(12,18,34,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "DM Sans", system-ui, sans-serif; background: var(--bg); color: var(--ink); height: 100dvh; overflow: hidden; }
    .hidden { display: none !important; }

    /* Auth */
    #auth-screen { min-height: 100dvh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(160deg, var(--brand-light), var(--bg)); }
    .auth-card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 20px;
      padding: 36px; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .auth-card h1 { font-family: Fraunces, serif; font-size: 2rem; color: var(--brand); margin-bottom: 4px; }
    .auth-card p.sub { color: var(--muted); margin-bottom: 28px; font-size: 0.95rem; }
    .tabs-auth { display: flex; gap: 8px; margin-bottom: 24px; }
    .tabs-auth button { flex: 1; padding: 10px; border: 1px solid var(--line); background: var(--bg);
      border-radius: 10px; font-weight: 600; cursor: pointer; }
    .tabs-auth button.active { background: var(--brand); color: #fff; border-color: var(--brand); }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px;
      font: inherit; margin-bottom: 14px; }
    input:focus { outline: 2px solid var(--brand); border-color: transparent; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border: none; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
      cursor: pointer; transition: .15s; }
    .btn-primary { background: var(--brand); color: #fff; width: 100%; }
    .btn-primary:hover { background: #0a3d39; }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .auth-err { color: #b91c1c; font-size: 0.85rem; margin-top: 8px; min-height: 1.2em; }

    /* App layout */
    #app-screen { display: grid; grid-template-columns: 280px 1fr; height: 100dvh; }
    @media (max-width: 768px) { #app-screen { grid-template-columns: 1fr; } .sidebar { display: none; } }

    .sidebar { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .sidebar-head { padding: 20px; border-bottom: 1px solid var(--line); }
    .sidebar-head h2 { font-family: Fraunces, serif; font-size: 1.35rem; color: var(--brand); }
    .sidebar-head span { font-size: 0.8rem; color: var(--muted); }
    .btn-new { margin: 16px; padding: 12px; background: var(--brand-light); color: var(--brand);
      border: 1px dashed #9ec5c0; border-radius: 12px; font-weight: 600; cursor: pointer; }
    .btn-new:hover { background: #d4ece8; }
    .sess-list { flex: 1; overflow-y: auto; padding: 0 12px 12px; }
    .sess-item { padding: 12px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 4px;
      font-size: 0.9rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sess-item:hover { background: var(--bg); color: var(--ink); }
    .sess-item.active { background: var(--brand-light); color: var(--brand); font-weight: 600; }
    .sidebar-foot { padding: 16px; border-top: 1px solid var(--line); font-size: 0.8rem; color: var(--muted); }
    .sidebar-foot button { background: none; border: none; color: var(--brand); font-weight: 600; cursor: pointer; }

    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar { padding: 16px 24px; background: rgba(255,255,255,.9); backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; }
    .topbar h3 { font-size: 1rem; font-weight: 600; }
    .topbar a { font-size: 0.85rem; color: var(--brand); text-decoration: none; }

    .messages { flex: 1; overflow-y: auto; padding: 24px; scroll-behavior: smooth; }
    .msg { display: flex; gap: 12px; margin-bottom: 20px; max-width: 820px; animation: fadeIn .25s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.user { margin-left: auto; flex-direction: row-reverse; }
    .avatar { width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
      font-size: 0.75rem; font-weight: 700; }
    .msg.assistant .avatar { background: var(--brand-light); color: var(--brand); }
    .msg.user .avatar { background: var(--user-bg); color: var(--user-fg); }
    .bubble { padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 0.95rem; white-space: pre-wrap; word-break: break-word; }
    .msg.assistant .bubble { background: var(--bot-bg); border: 1px solid var(--line); border-top-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    .msg.user .bubble { background: var(--user-bg); color: var(--user-fg); border-top-right-radius: 4px; }
    .msg-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
    .msg-actions button { font-size: 0.75rem; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--bg); cursor: pointer; font-weight: 600; color: var(--brand); }
    .msg-actions button:hover { background: var(--brand-light); }

    .typing { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; color: var(--muted); font-size: 0.9rem; }
    .dots { display: flex; gap: 4px; }
    .dots span { width: 7px; height: 7px; background: var(--brand); border-radius: 50%; animation: bounce 1.2s infinite; opacity: .5; }
    .dots span:nth-child(2) { animation-delay: .15s; }
    .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity: .4; } 40% { transform: translateY(-5px); opacity: 1; } }

    .composer { padding: 16px 24px 24px; background: linear-gradient(transparent, var(--bg)); }
    .composer-inner { display: flex; gap: 12px; max-width: 820px; margin: 0 auto; background: var(--surface);
      border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 16px; box-shadow: var(--shadow); }
    .composer textarea { flex: 1; border: none; resize: none; font: inherit; font-size: 0.95rem;
      padding: 10px 0; max-height: 140px; background: transparent; }
    .composer textarea:focus { outline: none; }
    .composer .btn-send { background: var(--brand); color: #fff; border-radius: 12px; padding: 12px 18px; align-self: flex-end; }
    .composer .btn-send:disabled { opacity: .5; cursor: not-allowed; }
    .hint { text-align: center; font-size: 0.75rem; color: var(--muted); margin-top: 10px; }
  </style>
</head>
<body>
  <div id="auth-screen">
    <div class="auth-card">
      <h1>Apura</h1>
      <p class="sub">Conversa eleitoral com dados oficiais do Brasil</p>
      <div class="tabs-auth">
        <button type="button" class="active" data-tab="login">Entrar</button>
        <button type="button" data-tab="registrar">Criar conta</button>
      </div>
      <form id="form-login">
        <label>E-mail</label>
        <input type="email" id="login-email" required autocomplete="email" />
        <label>Senha</label>
        <input type="password" id="login-senha" required autocomplete="current-password" />
        <button class="btn btn-primary" type="submit">Entrar</button>
      </form>
      <form id="form-registrar" class="hidden">
        <label>Nome</label>
        <input type="text" id="reg-nome" required minlength="2" />
        <label>E-mail</label>
        <input type="email" id="reg-email" required autocomplete="email" />
        <label>Senha (mín. 8 caracteres)</label>
        <input type="password" id="reg-senha" required minlength="8" autocomplete="new-password" />
        <button class="btn btn-primary" type="submit">Criar conta</button>
      </form>
      <p class="auth-err" id="auth-err"></p>
    </div>
  </div>

  <div id="app-screen" class="hidden">
    <aside class="sidebar">
      <div class="sidebar-head">
        <h2>Apura</h2>
        <span>Inteligência Eleitoral Brasil</span>
      </div>
      <button type="button" class="btn-new" id="btn-nova">+ Nova conversa</button>
      <div class="sess-list" id="sess-list"></div>
      <div class="sidebar-foot">
        <span id="user-email"></span><br />
        <button type="button" id="btn-sair">Sair</button>
      </div>
    </aside>
    <div class="main">
      <header class="topbar">
        <h3 id="chat-titulo">Nova conversa</h3>
        <a href="/guia" target="_blank" rel="noopener">Guia · Token MCP</a>
      </header>
      <div class="messages" id="messages"></div>
      <div class="composer">
        <div class="composer-inner">
          <textarea id="input-msg" rows="1" placeholder="Pergunte sobre eleições, candidatos, votos, contexto…"></textarea>
          <button type="button" class="btn btn-send" id="btn-send" disabled>Enviar</button>
        </div>
        <p class="hint">Inclua ano, cargo e lugar. Números vêm da base oficial — sem estimativa.</p>
      </div>
    </div>
  </div>

  <script>
    const API = '/apura/api';
    let jwt = localStorage.getItem('apura_jwt') || '';
    let sessaoId = '';
    let streaming = false;

    const $ = id => document.getElementById(id);

    function authHeaders() {
      return { Authorization: 'Bearer ' + jwt, 'Content-Type': 'application/json' };
    }

    async function api(path, opts = {}) {
      const r = await fetch(API + path, { ...opts, headers: { ...authHeaders(), ...opts.headers } });
      const text = await r.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { detail: text }; }
      if (!r.ok) throw new Error(typeof data.detail === 'string' ? data.detail : (data.detail?.[0]?.msg || 'Erro'));
      return data;
    }

    // Auth tabs
    document.querySelectorAll('.tabs-auth button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tabs-auth button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        $('form-login').classList.toggle('hidden', btn.dataset.tab !== 'login');
        $('form-registrar').classList.toggle('hidden', btn.dataset.tab !== 'registrar');
        $('auth-err').textContent = '';
      });
    });

    async function parseResponse(r) {
      const text = await r.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch {
        throw new Error(text.startsWith('Internal') ? 'Erro interno no servidor — tente de novo em instantes' : (text.slice(0, 180) || 'Erro no servidor'));
      }
      if (!r.ok) {
        const d = data.detail;
        throw new Error(typeof d === 'string' ? d : (Array.isArray(d) ? d.map(x => x.msg || x).join(', ') : 'Erro na requisição'));
      }
      return data;
    }

    $('form-login').addEventListener('submit', async e => {
      e.preventDefault();
      $('auth-err').textContent = '';
      try {
        const r = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: $('login-email').value, senha: $('login-senha').value })
        });
        entrar(await parseResponse(r));
      } catch (err) { $('auth-err').textContent = err.message; }
    });

    $('form-registrar').addEventListener('submit', async e => {
      e.preventDefault();
      $('auth-err').textContent = '';
      try {
        const r = await fetch(API + '/auth/registrar', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nome: $('reg-nome').value,
            email: $('reg-email').value,
            senha: $('reg-senha').value
          })
        });
        entrar(await parseResponse(r));
      } catch (err) { $('auth-err').textContent = err.message; }
    });

    function entrar(d) {
      jwt = d.token;
      localStorage.setItem('apura_jwt', jwt);
      $('auth-screen').classList.add('hidden');
      $('app-screen').classList.remove('hidden');
      $('user-email').textContent = d.email || '';
      initApp();
    }

    $('btn-sair').addEventListener('click', () => {
      jwt = '';
      localStorage.removeItem('apura_jwt');
      location.reload();
    });

    async function initApp() {
      await carregarSessoes();
      if (!sessaoId) await novaSessao();
    }

    async function carregarSessoes() {
      const list = await api('/sessoes');
      const el = $('sess-list');
      el.innerHTML = '';
      list.forEach(s => {
        const div = document.createElement('div');
        div.className = 'sess-item' + (s.id === sessaoId ? ' active' : '');
        div.textContent = s.titulo;
        div.onclick = () => abrirSessao(s.id, s.titulo);
        el.appendChild(div);
      });
    }

    async function novaSessao() {
      const s = await api('/sessoes', { method: 'POST', body: JSON.stringify({ titulo: 'Nova conversa' }) });
      await abrirSessao(s.id, s.titulo);
      await carregarSessoes();
    }

    $('btn-nova').addEventListener('click', () => novaSessao());

    async function abrirSessao(id, titulo) {
      sessaoId = id;
      $('chat-titulo').textContent = titulo;
      $('messages').innerHTML = '';
      document.querySelectorAll('.sess-item').forEach(el => el.classList.remove('active'));
      await carregarSessoes();
      const msgs = await api('/sessoes/' + id + '/mensagens');
      msgs.forEach(m => appendMsg(m.papel, m.conteudo, m.id, m.dados));
      scrollBottom();
    }

    function appendMsg(papel, texto, id, dados) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + papel;
      const av = document.createElement('div');
      av.className = 'avatar';
      av.textContent = papel === 'user' ? 'Você' : 'Ap';
      const bubble = document.createElement('div');
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = texto;
      bubble.appendChild(b);
      if (papel === 'assistant' && id) {
        const actions = document.createElement('div');
        actions.className = 'msg-actions';
        if (dados?.tool_results?.length) {
          ['Excel', 'HTML'].forEach((label, i) => {
            const btn = document.createElement('button');
            btn.textContent = 'Exportar ' + label;
            btn.onclick = () => exportar(id, i === 0 ? 'xlsx' : 'html');
            actions.appendChild(btn);
          });
        }
        bubble.appendChild(actions);
      }
      wrap.appendChild(av);
      wrap.appendChild(bubble);
      $('messages').appendChild(wrap);
    }

    function showTyping(fase) {
      removeTyping();
      const el = document.createElement('div');
      el.className = 'typing';
      el.id = 'typing';
      const labels = { pensando: 'Apura está pensando', consultando: 'Consultando a base oficial', redigindo: 'Apura está digitando' };
      el.innerHTML = '<div class="avatar" style="background:var(--brand-light);color:var(--brand);font-size:.75rem;font-weight:700">Ap</div><div><span>' + (labels[fase] || labels.pensando) + '</span><div class="dots"><span></span><span></span><span></span></div></div>';
      $('messages').appendChild(el);
      scrollBottom();
    }

    function removeTyping() {
      $('typing')?.remove();
    }

    function scrollBottom() {
      const m = $('messages');
      m.scrollTop = m.scrollHeight;
    }

    const input = $('input-msg');
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
      $('btn-send').disabled = !input.value.trim() || streaming;
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); }
    });

    $('btn-send').addEventListener('click', enviar);

    async function enviar() {
      const text = input.value.trim();
      if (!text || streaming || !sessaoId) return;
      streaming = true;
      $('btn-send').disabled = true;
      input.value = '';
      input.style.height = 'auto';
      appendMsg('user', text);
      showTyping('pensando');

      let assistantBubble = null;
      let fullText = '';

      try {
        const r = await fetch(API + '/chat', {
          method: 'POST',
          headers: authHeaders(),
          body: JSON.stringify({ sessao_id: sessaoId, mensagem: text })
        });
        if (!r.ok) throw new Error(await r.text());

        const reader = r.body.getReader();
        const dec = new TextDecoder();
        let buf = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += dec.decode(value, { stream: true });
          const parts = buf.split('\n\n');
          buf = parts.pop() || '';
          for (const block of parts) {
            if (!block.trim()) continue;
            let ev = 'message', data = '';
            block.split('\n').forEach(line => {
              if (line.startsWith('event: ')) ev = line.slice(7);
              if (line.startsWith('data: ')) data = line.slice(6);
            });
            if (!data) continue;
            const payload = JSON.parse(data);
            if (ev === 'status') showTyping(payload.fase);
            if (ev === 'token') {
              removeTyping();
              if (!assistantBubble) {
                const wrap = document.createElement('div');
                wrap.className = 'msg assistant';
                wrap.id = 'msg-stream';
                wrap.innerHTML = '<div class="avatar">Ap</div><div class="bubble"><div class="bubble-text"></div></div>';
                $('messages').appendChild(wrap);
                assistantBubble = wrap.querySelector('.bubble-text');
              }
              fullText += payload.text;
              assistantBubble.textContent = fullText;
              scrollBottom();
            }
            if (ev === 'error') throw new Error(payload.mensagem);
            if (ev === 'done') {
              removeTyping();
              $('msg-stream')?.removeAttribute('id');
              await carregarSessoes();
              const msgs = await api('/sessoes/' + sessaoId + '/mensagens');
              const last = msgs.filter(m => m.papel === 'assistant').pop();
              $('messages').lastElementChild?.remove();
              if (last) appendMsg('assistant', last.conteudo, last.id, last.dados);
              if ($('chat-titulo').textContent === 'Nova conversa') {
                $('chat-titulo').textContent = text.slice(0, 60) + (text.length > 60 ? '…' : '');
              }
            }
          }
        }
      } catch (err) {
        removeTyping();
        appendMsg('assistant', 'Não foi possível completar: ' + err.message);
      } finally {
        streaming = false;
        $('btn-send').disabled = !input.value.trim();
      }
      scrollBottom();
    }

    async function exportar(mensagemId, tipo) {
      const r = await fetch(API + '/export/' + tipo, {
        method: 'POST',
        headers: authHeaders(),
        body: JSON.stringify({ mensagem_id: mensagemId })
      });
      if (!r.ok) { alert('Exportação falhou'); return; }
      const blob = await r.blob();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = tipo === 'xlsx' ? 'apura-dados.xlsx' : 'apura-relatorio.html';
      a.click();
    }

    if (jwt) {
      api('/auth/eu').then(() => {
        $('auth-screen').classList.add('hidden');
        $('app-screen').classList.remove('hidden');
        initApp();
      }).catch(() => localStorage.removeItem('apura_jwt'));
    }
  </script>
</body>
</html>
